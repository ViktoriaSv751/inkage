<!doctype html>
<html><head><meta charset="utf-8">
<script src="a/mark.js"></script>
<style>
@font-face{font-family:G;src:url(f/geist-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:G;src:url(f/geist-sans-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:G;src:url(f/geist-sans-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:G;src:url(f/geist-sans-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:G;src:url(f/geist-sans-latin-800-normal.woff2);font-weight:800}
:root{
  --ink:#000; --ink2:#5c5c62; --ink3:#8c8c94; --paper:#fff; --mist:#f4f4f7; --line:#e7e7ec;
  --st:#5b3df5; --st2:#4528d8; --sttint:#eeeaff; --faded:#6f86a6;
  --green:#1f9d63; --amber:#d98b16; --red:#e5484d;
  --pw:74vw; --ptop:58vw; --hpad:7vw; --htop:15vw;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:#fff}
body{font-family:G,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11';color:var(--ink)}
.fr{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--paper)}
.fr.dark{background:#000;color:#fff}
.fr.vio{background:#5b3df5;color:#fff}
.vio .hd p{color:rgba(255,255,255,.8)}
.vio .ph{box-shadow:0 0 0 calc(var(--pw)*.004) #7a7a82 inset,0 4vw 8vw rgba(20,0,90,.25),0 14vw 26vw rgba(20,0,90,.4)}

/* panorama stencil art (slides 2–7 read as one continuous sheet) */
.pano{position:absolute;top:0;height:100%;width:600vw;pointer-events:none}
.pano img{position:absolute;display:block}

/* headline block */
.hd{position:absolute;left:var(--hpad);right:var(--hpad);top:var(--htop);z-index:5}
.hd h1{font-weight:800;font-size:10.4vw;line-height:.95;letter-spacing:-.052em;text-wrap:balance}
.hd p{margin-top:3.6vw;font-size:4.15vw;line-height:1.32;font-weight:500;color:var(--ink2);letter-spacing:-.012em;max-width:80vw;text-wrap:pretty}
.dark .hd p{color:#a9a9b3}
.hd .tm{color:var(--ink3)}
.dark .hd .tm{color:#77777f}

/* phone */
.ph{position:absolute;z-index:3;width:var(--pw);left:calc(50vw - var(--pw)/2);top:var(--ptop);aspect-ratio:9/19.4;border-radius:calc(var(--pw)*.165);
  background:linear-gradient(145deg,#3a3a3f,#0d0d0f 30%,#1d1d21 70%,#4a4a50);padding:calc(var(--pw)*.026);
  box-shadow:0 0 0 calc(var(--pw)*.004) #6b6b72 inset, 0 3vw 6vw rgba(18,10,60,.16), 0 12vw 22vw rgba(18,10,60,.22)}
.dark .ph{box-shadow:0 0 0 calc(var(--pw)*.004) #8a8a92 inset,0 0 0 .25vw #2a2a30, 0 10vw 24vw rgba(91,61,245,.28)}
.scr{position:relative;width:100%;height:100%;border-radius:calc(var(--pw)*.142);overflow:hidden;background:#fff;color:#000;font-size:calc(var(--pw)*.948/393*16)}
.island{position:absolute;z-index:9;top:.62em;left:50%;transform:translateX(-50%);width:7.6em;height:2.2em;border-radius:2em;background:#000}
.sb{position:relative;z-index:8;height:3.4em;display:flex;align-items:flex-end;justify-content:space-between;padding:0 1.9em .55em 2.3em;font-weight:600;font-size:1.02em;letter-spacing:-.01em}
.sb .ic{display:flex;gap:.36em;align-items:center}
.sig{display:flex;gap:.12em;align-items:flex-end;height:.75em}.sig i{display:block;width:.2em;background:currentColor;border-radius:.06em}
.bat{width:1.55em;height:.75em;border:.09em solid currentColor;border-radius:.24em;padding:.08em;opacity:.95;position:relative}.bat::after{content:'';position:absolute;right:-.2em;top:.22em;width:.1em;height:.3em;background:currentColor;border-radius:0 .1em .1em 0}.bat i{display:block;height:100%;width:80%;background:currentColor;border-radius:.12em}
.wifi{width:1em;height:.75em}
.scr.over .sb{color:#fff}

/* app chrome */
.ab{display:flex;align-items:center;justify-content:space-between;padding:.5em 1.25em .7em}
.lg{display:flex;align-items:center;gap:.42em;font-weight:800;font-size:1.22em;letter-spacing:-.035em}
.lg svg{width:1.3em;height:1.2em;fill:currentColor}
.av{width:2em;height:2em;border-radius:50%;background:center/cover}
.pg{padding:0 1.25em}
.t1{font-size:1.75em;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.t2{font-size:.92em;color:var(--ink2);margin-top:.3em}
.cap{font-size:.8em;font-weight:600;color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;height:3.1em;border-radius:3em;background:#000;color:#fff;font-weight:600;font-size:1em;letter-spacing:-.01em}
.btn.st{background:var(--st)}
.chip{display:inline-flex;align-items:center;height:2.1em;padding:0 .9em;border-radius:2em;background:var(--mist);font-size:.84em;font-weight:600;color:#333}
.chip.on{background:#000;color:#fff}
.pill{position:absolute;display:inline-flex;align-items:center;gap:.35em;height:2em;padding:0 .8em;border-radius:2em;background:rgba(255,255,255,.94);font-size:.8em;font-weight:600;color:#000;backdrop-filter:blur(8px)}
.pill.dk{background:rgba(0,0,0,.55);color:#fff}
.ph-img{position:relative;border-radius:1.25em;overflow:hidden;background:#ddd center/cover}
.tabs{position:absolute;left:0;right:0;bottom:0;height:5.4em;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:.75em;font-size:.68em;font-weight:600;color:#9a9aa2}
.tabs b{display:flex;flex-direction:column;align-items:center;gap:.35em;font-weight:600}.tabs b i{display:block;width:1.9em;height:1.9em;border-radius:.6em;background:#e3e3e8}.tabs b.on{color:#000}.tabs b.on i{background:#000}

/* floating cards */
.fc{position:absolute;z-index:6;background:#fff;color:#000;border-radius:4.4vw;padding:3.6vw 4vw;
  box-shadow:0 .3vw .8vw rgba(0,0,0,.05),0 3vw 7vw rgba(25,15,70,.13),0 9vw 18vw rgba(25,15,70,.12)}
.fc h4{font-size:3.5vw;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.fc p{font-size:2.85vw;color:var(--ink2);margin-top:.9vw;line-height:1.3;font-weight:500}
.fc .k{font-size:2.6vw;font-weight:600;color:var(--ink3)}
.dark .fc{background:#16161b;color:#fff;box-shadow:0 0 0 .2vw #2a2a33 inset,0 6vw 16vw rgba(0,0,0,.6)}
.dark .fc p{color:#a9a9b3}

/* hero strips */
.strips{position:absolute;left:0;right:0;bottom:0;display:flex;gap:.3vw;z-index:1}
.strip{position:relative;flex:1;overflow:hidden}
.strip img{position:absolute;top:0;height:100%;width:100vw;object-fit:cover}
.strip span{position:absolute;left:50%;transform:translateX(-50%);bottom:6.5vw;font-size:3.2vw;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 .2vw 1.4vw rgba(0,0,0,.5)}
.strips::before{content:'';position:absolute;z-index:2;left:0;right:0;top:-1px;height:30%;background:linear-gradient(#000,rgba(0,0,0,0))}
.strips::after{content:'';position:absolute;z-index:2;left:0;right:0;bottom:0;height:22%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55))}
.strip span{z-index:3}
.brand{position:absolute;z-index:5;left:var(--hpad);top:calc(var(--htop) - 9.5vw);display:flex;align-items:center;gap:2.4vw;font-weight:800;font-size:4.8vw;letter-spacing:-.04em}
.brand i{display:flex;align-items:center;justify-content:center;width:8.6vw;height:8.6vw;border-radius:2.1vw;background:#fff;color:#000}
.brand svg{width:66%;height:66%;fill:currentColor}

.split{position:absolute;left:0;right:0;bottom:0;overflow:hidden;--x:51%}
.split img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%}
.split img.a{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.split::before{content:'';position:absolute;z-index:2;left:0;right:0;top:-1px;height:26%;background:linear-gradient(#000,rgba(0,0,0,0))}
.hand{position:absolute;z-index:3;top:0;bottom:0;left:var(--x);width:0}
.hand i{position:absolute;top:0;bottom:0;left:-.3vw;width:.6vw;background:#fff;box-shadow:0 0 2vw rgba(0,0,0,.35)}
.hand b{position:absolute;top:58%;left:-6.5vw;width:13vw;height:13vw;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1vw 4vw rgba(0,0,0,.35)}
.hand svg{width:55%;height:55%}
.lb{position:absolute;z-index:3;bottom:8vw;height:9vw;display:flex;align-items:center;padding:0 3.8vw;border-radius:6vw;font-size:3.7vw;font-weight:700;letter-spacing:-.02em}
.lb.l{left:6vw;background:rgba(255,255,255,.94);color:#000}
.lb.r{right:6vw;background:#5b3df5;color:#fff}
/* score bars */
.row{display:flex;align-items:center;gap:.7em;padding:.72em 0;border-bottom:1px solid var(--line)}
.row b{flex:none;width:7.6em;font-size:.92em;font-weight:600}
.bar{flex:1;height:.5em;border-radius:1em;background:var(--mist);overflow:hidden}.bar i{display:block;height:100%;border-radius:1em}
.row em{flex:none;width:2em;text-align:right;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

/* play format: shorter canvas */
.play{--pw:62vw;--ptop:52vw;--htop:11vw}
.play .hd h1{font-size:9.6vw}
.play .hd p{font-size:3.9vw;margin-top:3vw}
.ios63{}
</style></head>
<body><div id="root"></div>
<script>
const q=new URLSearchParams(location.search);
const S=+q.get('s')||1, LANG=q.get('l')||'en', FMT=q.get('f')||'ios';
const A=p=>'a/'+p;
const mark=(c='')=>`<svg viewBox="0 0 1213 1135" class="${c}"><path d="${window.MARK}" fill-rule="evenodd"/></svg>`;

const TX={

 diary:'Healing diary', day:'Day 9 of 28', steps:['Wash gently, pat dry','Very thin layer of ointment','No pools, baths or sauna'], nextS:'Day 10', nextT:'Most flakes are gone. It can look a bit cloudy.',

},

  ['Így néz ki ma a bőrödön.','A saját fotód, a bőrtónusod, valódi méretben.'],

 ],
 ages:['Ma','1 év','10 év','30 év','50 év'],
 today:'Ma', yrs:'év múlva', skin:'Bőrtónus', matched:'Bőrtónus illesztve', size:'Valódi méret', sizeV:'8 cm széles', see10:'Megnézem 10 év múlva', calf:'Vádli', prev:'Az előnézeted', fore:'Belső alkar',
 film:'Ugyanaz a tetoválás, négy pillanat', y:['Ma','10','30','50'],

 poll:'Melyiket csináltassam?', votes:'14 szavazat', a:'Hold és virágok', b:'Vadvirágok', share:'Szavazó-link megosztása', friend:'„A holdas. 100%.”', friendN:'Anna',
 diary:'Gyógyulási napló', day:'9. nap / 28', steps:['Óvatos mosás, szárazra itatás','Nagyon vékony réteg krém','Uszoda, kád, szauna még nem'], nextS:'10. nap', nextT:'A hámlás nagy része elmúlt, kicsit tejszerű lehet.',

}}[LANG];

const sb=`<div class="island"></div><div class="sb"><span>9:41</span><span class="ic"><span class="sig"><i style="height:35%"></i><i style="height:55%"></i><i style="height:78%"></i><i style="height:100%"></i></span><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4.2-4.3L2.4 5.8a8 8 0 0 1 11.2 0l-1.4 1.4a6 6 0 0 0-8.4 0ZM.3 3.7-.1 3.3" fill="currentColor"/><path d="M1 4.4a10 10 0 0 1 14 0l-1.4 1.4a8 8 0 0 0-11.2 0L1 4.4Z" fill="currentColor"/></svg><span class="bat"><i></i></span></span></div>`;
const appbar=(right='')=>`<div class="ab"><div class="lg">${mark()}InkAge</div>${right||'<div class="av" style="background:var(--sttint);color:var(--st2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em">V</div>'}</div>`;
const phone=(inner,cls='')=>`<div class="ph"><div class="scr ${cls}">${sb}${inner}</div></div>`;
const tabs=(on)=>{const n=LANG==='hu'?['Előnézet','Felfedezés','Galéria','Profil']:['Preview','Explore','Gallery','Profile'];return `<div class="tabs">${n.map((t,i)=>`<b class="${i===on?'on':''}"><i></i>${t}</b>`).join('')}</div>`};
const hd=(n)=>`<div class="hd"><h1>${TX.h[n][0]}</h1><p>${TX.h[n][1]}</p></div>`;

/* panorama art: x in panorama vw (0..600 = slides 2..7) */
const PANO=[
  ['d-compass-st.png',  60, 112, 78, -8],
  ['d-frose-st.png',   150,  70, 60, 6],
  ['d-sunmoon-st.png', 238, 120, 74, 0],
  ['d-humm-st.png',    330,  80, 70, -10],
  ['d-peony-st.png',   418, 132, 64, 8],
  ['d-lav-st.png',     505,  86, 62, 4],
  ['d-fern-st.png',    586, 120, 58, -14],
];
const art=(f,x,y,w,r=0,op=.95)=>`<img class="art" src="${A(f)}" style="position:absolute;z-index:1;left:${x}vw;top:calc(var(--ptop) + var(--pw) * ${y/74});width:${w}vw;transform:rotate(${r}deg);opacity:${op}">`;
const pano=(slide)=>{
  const off=(slide-2)*100;
  return `<div class="pano" style="left:${-off}vw">${PANO.map(([f,x,y,w,r])=>`<img src="${A(f)}" style="left:${x-w/2}vw;top:${y}vw;width:${w}vw;transform:rotate(${r}deg);opacity:.95">`).join('')}</div>`;
};

const slides={
1(){
  return `<div class="fr dark">
   <div class="brand"><i>${mark()}</i>InkAge</div>
   <div class="hd"><h1>${TX.h[1][0]}</h1><p>${TX.h[1][1]}</p></div>

     <img src="${A('sw4.jpg')}"><img class="a" src="${A('sw0.jpg')}">
     <div class="hand"><i></i><b><svg viewBox="0 0 24 24"><path d="M9 6 3 12l6 6M15 6l6 6-6 6" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></b></div>
     <span class="lb l">${TX.ages[0]}</span><span class="lb r">${TX.ages[4]}</span>
   </div>

},
2(){
  const sw=['#f3d8c6','#e9c2a6','#d6a27f','#b67c57','#8a5a3c','#5e3c27'];
  const scr=`${appbar()}
   <div class="pg"><div class="t1">${TX.prev}</div><div class="t2">${TX.fore} · ${TX.sizeV}</div></div>

     <div style="display:flex;gap:.55em;margin-top:.6em">${sw.map((c,i)=>`<span style="width:2.3em;height:2.3em;border-radius:50%;background:${c};${i===2?'box-shadow:0 0 0 .18em #fff,0 0 0 .34em #000':''}"></span>`).join('')}</div></div>
   <div class="pg" style="margin-top:1.3em"><div class="btn">${TX.see10}</div></div>${tabs(0)}`;
  return `<div class="fr">${art('d-compass-st.png',58,18,80,-8)}${art('d-frose-st.png',-30,40,62,10)}${hd(2)}${phone(scr)}
   <div class="fc" style="left:4.5vw;top:calc(var(--ptop) + var(--pw) * 0.4865);width:46vw">
     <div style="display:flex;align-items:center;gap:2.4vw"><span style="width:7vw;height:7vw;border-radius:50%;background:#d6a27f;box-shadow:0 0 0 .7vw #fff,0 0 0 1.1vw #000;flex:none"></span><div><h4>${TX.matched}</h4><p style="margin-top:.3vw">${TX.size} · ${TX.sizeV}</p></div></div>
     <div style="margin-top:2.6vw;height:4.2vw;border-radius:1vw;background:repeating-linear-gradient(90deg,#000 0 .25vw,transparent .25vw 3.4vw),var(--mist);background-size:100% 45%,100% 100%;background-repeat:no-repeat;position:relative"></div>
   </div></div>`;
},
3(){
  const scr=`<div class="ph-img" style="position:absolute;inset:0;border-radius:0;background-image:url(${A('md2.jpg')});background-position:50% 40%"></div>
   <div style="position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.72))"></div>
   <div style="position:relative;padding:.4em 1.25em"><span class="pill dk" style="position:static">${TX.calf}</span></div>
   <div style="position:absolute;left:1.3em;right:1.3em;bottom:2.4em;color:#fff">
     <div style="font-size:6.2em;font-weight:800;letter-spacing:-.06em;line-height:.9">30</div>
     <div style="font-size:1.05em;font-weight:600;margin:.35em 0 1.3em;opacity:.92">${TX.yrs}</div>
     <div style="position:relative;height:1.6em">
       <div style="position:absolute;top:.7em;left:0;right:0;height:.22em;border-radius:1em;background:rgba(255,255,255,.35)"></div>

const root=document.getElementById('root');
root.innerHTML=slides[S]();
const fr=root.firstElementChild; fr.classList.add(FMT);
// hero strips start right under the text
function layout(){
  const hd=fr.querySelector('.hd');
  if(S===1){ const b=hd.getBoundingClientRect().bottom; fr.style.setProperty('--stripTop',(b+innerWidth*.07)+'px'); }
  else { const b=hd.getBoundingClientRect().bottom; fr.style.setProperty('--ptop',(b+innerWidth*.075)+'px'); }
}
// fit headline to max 3 lines
function fit(){const h1=fr.querySelector('.hd h1');
if(h1){ let fs=parseFloat(getComputedStyle(h1).fontSize); const lh=()=>parseFloat(getComputedStyle(h1).lineHeight);
  while(h1.getBoundingClientRect().height>lh()*3.05 && fs>20){ fs-=1; h1.style.fontSize=fs+'px'; } }}
if(q.get('scr')){document.head.insertAdjacentHTML('beforeend','<style>.fr>*:not(.ph){display:none!important}.fr{background:#fff!important}.ph{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;padding:0!important;border-radius:0!important;box-shadow:none!important;background:none!important;--pw:100vw}.scr{border-radius:0!important}</style>');}
document.fonts.ready.then(()=>{ fit(); layout(); document.body.dataset.ready=1; });
